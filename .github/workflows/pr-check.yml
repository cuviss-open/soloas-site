name: PR check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build the site
        run: python3 tools/build_docs.py
      - name: Check links and alternates
        run: python3 tools/check_site.py
